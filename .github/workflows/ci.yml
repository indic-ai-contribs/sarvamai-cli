name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  package:
    # Guards the class of bug that shipped in 0.2.11: the published tarball's
    # bin path was wrong, which no amount of source-level testing would catch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack and install the tarball globally
        run: |
          npm pack
          npm install -g ./sarvamai-cli-*.tgz
      - name: The installed binary must run
        run: |
          sarvam --help | grep -q "sarvamai-cli"
          sarvam --approve nonsense 2>&1 | grep -q "Invalid --approve" || {
            echo "expected --approve validation to reject a bad value"; exit 1; }
